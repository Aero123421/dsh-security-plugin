{% extends "base.html" %}
{% block title %}Sign in · Docvault{% endblock %}
{% block content %}
<h1>Sign in</h1>
<form method="post">
  {{ form.hidden_tag() }}
  <label>{{ form.email.label }} {{ form.email(autocomplete="username") }}</label>
  <label>{{ form.password.label }} {{ form.password(autocomplete="current-password") }}</label>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
